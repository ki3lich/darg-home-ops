repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
        args: [--allow-multiple-documents]
        # HA blueprints use the !input tag, which PyYAML safe_load cannot
        # construct — same class of false-fail pod-operations.md warns about
        # for !include. Helm templates below carry Go-template syntax.
        exclude: ^(mf-base-chart/templates/|docs/home-assistant/blueprints/)
      - id: trailing-whitespace
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: detect-aws-credentials
        args:
          - --allow-missing-credentials
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.25.1
    hooks:
      - id: gitleaks
